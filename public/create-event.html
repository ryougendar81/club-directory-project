<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admin | Add Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: #1e293b; color: white; padding: 40px 30px; }
        .sidebar-brand { font-size: 1.5rem; font-weight: 600; color: #6366f1; margin-bottom: 50px; text-decoration: none; display: block;}
        .sidebar-link { display: block; padding: 15px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; }
        .sidebar-link:hover, .active { background: rgba(99,102,241,0.1); color: #818cf8; }
        .content { flex: 1; padding: 50px; }
        .panel { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { background: #6366f1; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="admin.html" class="sidebar-brand">Admin Console</a>
        <a href="admin.html" class="sidebar-link">Overview</a>
        <a href="create-club.html" class="sidebar-link">Add Club</a>
        <a href="create-event.html" class="sidebar-link active">Add Event</a>
        <a href="view-feedback.html" class="sidebar-link">View Feedback</a>
    </div>
    <div class="content">
        <h1>Schedule Event</h1>
        <div class="panel">
            <form action="/api/admin/create-event" method="POST">
                <select name="club_id" id="club-sel" required></select>
                <input type="text" name="event_name" placeholder="Event Name" required>
                <input type="date" name="event_date" required>
                <input type="text" name="venue" placeholder="Venue">
                <select name="coordinator_id" id="coord-sel" required><option value="">Pick Coordinator</option></select>
                <button type="submit">Publish Event</button>
            </form>
        </div>
    </div>
    <script>
        async function init() {
            const clubs = await (await fetch('/api/admin/clubs')).json();
            document.getElementById('club-sel').innerHTML = clubs.map(c => `<option value="${c.club_id}">${c.club_name}</option>`).join('');
            const users = await (await fetch('/api/admin/all-users')).json();
            document.getElementById('coord-sel').innerHTML += users.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
        }
        window.onload = init;
    </script>
</body>
</html>
