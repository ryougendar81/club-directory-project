<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Register | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 24px; width: 400px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Join Community</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="College Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <div style="display:flex; gap:10px;">
                <input type="text" id="dept" placeholder="Dept">
                <input type="text" id="roll" placeholder="Roll No">
            </div>
            <select id="role" required>
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Create Account</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.85rem; opacity: 0.7;">Already have an account? <a href="login.html" style="color:#34d399; text-decoration:none;">Login</a></p>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    department: document.getElementById('dept').value,
                    roll_no: document.getElementById('roll').value,
                    role: document.getElementById('role').value
                })
            });
            const result = await res.json();
            if (result.success) { alert("Registration successful!"); window.location.href = 'login.html'; }
            else alert("Error: " + result.message);
        });
    </script>
</body>
</html>
