<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Dashboard | Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; margin: 0; }
        header { background: rgba(255,255,255,0.02); padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .container { padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
        .btn-join { background: #6366f1; color: white; }
        .btn-success { background: #10b981; color: white; cursor: default; }
        .btn-feedback { background: #f59e0b; color: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 24px; width: 400px; position: relative; }
        input, textarea { width: 100%; padding: 12px; margin-top: 15px; border-radius: 10px; background: #0f172a; border: 1px solid #334155; color: white; box-sizing: border-box; }
    </style>
</head>
<body>
    <header><h2>Club<span style="color:#6366f1;">Portal</span></h2><button onclick="localStorage.clear(); location.href='login.html'">Logout</button></header>
    <div class="container"><div id="club-list" class="grid"></div></div>
    <div id="modal" class="modal"><div class="modal-content" id="modal-body"></div></div>

    <script>
        const userId = localStorage.getItem('studentId');
        if(!userId) window.location.href = 'login.html';
        
        let currentMId = null; // Captured when joining event
        let activeEventId = null;

        async function load() {
            const res = await fetch('/api/admin/clubs');
            const clubs = await res.json();
            document.getElementById('club-list').innerHTML = clubs.map(c => `
                <div class="card">
                    <h3>${c.club_name}</h3>
                    <div id="c-area-${c.club_id}"><button class="btn btn-join" onclick="joinClub('${c.club_id}')">Join Club</button></div>
                    <button class="btn btn-join" style="background:none; border:1px solid #6366f1; color:#818cf8;" onclick="viewEvents('${c.club_id}', '${c.club_name}')">View Events</button>
                </div>
            `).join('');
        }

        async function joinClub(cid) {
            const res = await fetch('/api/join-club', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, club_id: cid })});
            if((await res.json()).success) document.getElementById(`c-area-${cid}`).innerHTML = `<button class="btn btn-success">Joined ✓</button>`;
        }

        async function viewEvents(cid, name) {
            document.getElementById('modal').style.display = 'flex';
            const body = document.getElementById('modal-body');
            body.innerHTML = `<h3>${name} Events</h3>`;
            const res = await fetch(`/api/events/${cid}`);
            const events = await res.json();
            body.innerHTML += (events.length ? events.map(e => `
                <div style="background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; margin-top:10px;">
                    <strong>${e.event_name}</strong>
                    <div id="e-area-${e.event_id}">
                        <button class="btn btn-join" onclick="joinEvent('${cid}', '${e.event_id}')">Join Event</button>
                    </div>
                </div>
            `).join('') : '<p>No events found.</p>') + `<button class="btn" onclick="closeModal()" style="background:#475569; margin-top:20px;">Close</button>`;
        }

        async function joinEvent(cid, eid) {
            const res = await fetch('/api/join-event', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_id: userId, club_id: cid, event_id: eid })});
            const data = await res.json();
            if(data.success) {
                currentMId = data.membership_id; 
                activeEventId = eid;
                document.getElementById(`e-area-${eid}`).innerHTML = `
                    <button class="btn btn-success">Joined ✓</button>
                    <button class="btn btn-feedback" onclick="openFeedback()">Give Feedback</button>
                `;
            } else { alert("Error: " + data.message); }
        }

        function openFeedback() {
            document.getElementById('modal-body').innerHTML = `
                <h3>Event Feedback</h3>
                <input type="number" id="rt" min="1" max="5" value="5">
                <textarea id="cm" placeholder="How was the event?"></textarea>
                <button class="btn btn-join" style="background:#10b981;" onclick="submitFeedback()">Submit Feedback</button>
            `;
        }

        async function submitFeedback() {
            const res = await fetch('/api/submit-feedback', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ 
                    membership_id: currentMId, 
                    event_id: activeEventId, 
                    rating: document.getElementById('rt').value, 
                    comments: document.getElementById('cm').value 
                })
            });
            const result = await res.json();
            if(result.success) {
                alert("Feedback Saved!");
                closeModal();
            } else {
                alert("Error: " + result.message);
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        window.onload = load;
    </script>
</body>
</html>
